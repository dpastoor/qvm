name: integration-tests

on:
  pull_request:
    paths:
      - 'internal/gh/**'
      - 'cmd/**'
      - 'internal/pipeline/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Run unit tests
        run: go test ./internal/gh -v

      - name: Run integration tests (GitHub API)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./internal/gh -v -tags=integration -run TestReleaseAssetAvailability

      - name: Test asset availability for Quarto versions
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: go test ./internal/gh -v -tags=integration -run TestGetReleases

  # Separate job for download tests (slower, only run on main branch or manually)
  download-tests:
    name: Download Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Run download integration tests
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          RUN_DOWNLOAD_TESTS: "true"
        run: go test ./internal/gh -v -tags=integration -run TestDownloadReleaseAsset_RealDownload -timeout=10m
